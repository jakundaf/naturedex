services:
  naturedex-db:
    image: mysql:8
    container_name: naturedex-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: naturedex
      MYSQL_USER: natureuser
      MYSQL_PASSWORD: naturepass
    ports:
      - "3306:3306"
    networks:
      - naturedex-net

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    networks:
      - naturedex-net

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8082:8082"
    networks:
      - naturedex-net

  api_gateway:
    build: ./api_gateway
    container_name: api_gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
    networks:
      - naturedex-net

  observation-service:
    build: ./observation-service
    container_name: observation-service
    ports:
      - "8083:8083"
    networks:
      - devnet
      - naturedex-net
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: eu-central-1
      AWS_DEFAULT_REGION: eu-central-1
      SPRING_APPLICATION_JSON: >
        {
          "app": {
            "aws": {
              "region": "eu-central-1",
              "s3": {
                "bucket": "naturedex-observations-jakundaf",
                "key-prefix": "user",
                "presign-ttl-minutes": 10
              }
            },
            "upload": {
              "allowed-content-types": [
                "image/jpeg",
                "image/png"
              ],
              "max-bytes": 10485760
            }
          }
        }

  species-service:
    build: ./species-service
    container_name: species-service
    ports:
      - "8084:8084"
    networks:
      - naturedex-net

  recognition-worker:
    build: ./recognition-worker
    container_name: recognition-worker
    ports:
      - "8085:8085"
    networks:
      - devnet
      - naturedex-net

networks:
  naturedex-net:
    driver: bridge
  devnet:
    external: true
