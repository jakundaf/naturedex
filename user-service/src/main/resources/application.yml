server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://naturedex-db:3306/naturedex?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: natureuser
    password: naturepass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  application:
    name: user-service

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: naaturedex_super_secure_jwt_secret_2025!

jwt:
  secret: naturedex_super_secure_jwt_secret_2025!
  expiration: 86400000

depends_on:
  - naturedex-db

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG