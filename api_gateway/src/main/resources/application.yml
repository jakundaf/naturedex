server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: naturedex_super_secure_jwt_secret_2025!

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: http://user-service:8082
              predicates:
                - Path=/api/users/**

            - id: observation-service
              uri: http://observation-service:8083
              predicates:
                - Path=/api/observations/**

            - id: species-service
              uri: http://species-service:8084
              predicates:
                - Path=/api/species, /api/species/**

      default-filters:
        - AddRequestHeader=X-Gateway, Naturedex-Gateway
        - RemoveRequestHeader=Cookie

jwt:
  secret: naturedex_super_secure_jwt_secret_2025!
  expiration: 86400000  # 1 dzie? w milisekundach (24h)

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
